<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/pages.css">
  <meta charset="UTF-8">
  <title>צור קשר - LottoGun</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Heebo", Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      direction: rtl;
    }
    .container {
      max-width: 640px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      margin-top: 40px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    p {
      text-align: center;
      color: #444;
    }
    .advertise-note {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 12px;
      padding: 20px 18px;
      margin-bottom: 18px;
      text-align: center;
      color: #312e81;
    }

    .advertise-email-link {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff !important;
      font-weight: 800;
      font-size: 1.05rem;
      text-decoration: none;
    }

    .advertise-email-link:hover {
      color: #fff !important;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    input, textarea, select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
      font-family: inherit;
    }
    button {
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 700;
    }
    button:hover {
      background: #556cd6;
    }
  </style>
</head>
<body class="app">
<div id="site-header"></div>
<script src="/common.js" defer></script>
<div class="app-shell">
<div class="legal-page contact-page">
    <h1 id="pageTitle">צור קשר</h1>
    <p id="pageIntro">נשמח לשמוע מכם! מלאו את הטופס ונחזור אליכם בהקדם.</p>
    <div class="advertise-note" id="advertisePanel" hidden>
      <strong>מעוניינים לפרסם ב-LottoGun?</strong><br>
      שלחו לנו מייל ונחזור אליכם עם פרטים:
      <br>
      <a
        class="advertise-email-link"
        id="advertiseEmailLink"
        href="mailto:lottogun.office@gmail.com?subject=%D7%A4%D7%A8%D7%A1%D7%95%D7%9D%20%D7%91-LottoGun"
      >lottogun.office@gmail.com</a>
      <br><small style="opacity:0.85;margin-top:8px;display:inline-block;">לחיצה תפתח את תיבת המייל שלכם</small>
    </div>

    <form id="contactForm">
      <select id="topic">
        <option value="general">פנייה כללית</option>
        <option value="advertise">פרסום באתר</option>
        <option value="support">תמיכה טכנית</option>
        <option value="feedback">משוב והצעות</option>
      </select>
      <input type="text" id="name" placeholder="שם מלא" required>
      <input type="email" id="email" placeholder="אימייל" required>
      <textarea id="message" rows="6" placeholder="ההודעה שלך..." required></textarea>
      <button type="submit">שלח</button>
    </form>
  </div>
</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const topic = params.get("topic");
    const topicSelect = document.getElementById("topic");
    const contactForm = document.getElementById("contactForm");
    const advertisePanel = document.getElementById("advertisePanel");

    if (topic === "advertise") {
      window.location.replace("/advertise.html");
    }

    function syncAdvertiseMode() {
      const isAdvertise = topicSelect.value === "advertise";
      advertisePanel.hidden = !isAdvertise;
      contactForm.hidden = isAdvertise;

      if (isAdvertise) {
        document.getElementById("pageTitle").textContent = "פרסום ב-LottoGun";
        document.getElementById("pageIntro").textContent = "לפרטים על פרסום — שלחו לנו מייל:";
      } else {
        document.getElementById("pageTitle").textContent = "צור קשר";
        document.getElementById("pageIntro").textContent = "נשמח לשמוע מכם! מלאו את הטופס ונחזור אליכם בהקדם.";
      }
    }

    if (topic) {
      topicSelect.value = topic;
    }
    topicSelect.addEventListener("change", syncAdvertiseMode);
    syncAdvertiseMode();

    document.getElementById("contactForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = encodeURIComponent(document.getElementById("name").value);
      const email = encodeURIComponent(document.getElementById("email").value);
      const message = encodeURIComponent(document.getElementById("message").value);
      const selectedTopic = topicSelect.options[topicSelect.selectedIndex].text;

      const subject = encodeURIComponent("פנייה מאתר LottoGun - " + selectedTopic);
      let body = "נושא: " + selectedTopic + "%0Aשם: " + name + "%0Aאימייל: " + email;
      body += "%0Aהודעה: " + message;

      window.location.href = "mailto:lottogun.office@gmail.com?subject=" + subject + "&body=" + body;
    });
  </script>
<div id="footer"></div>
</body>
</html>

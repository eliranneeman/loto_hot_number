<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פרסום ב-LottoGun</title>
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pages.css">
  <style>
    .advertise-page {
      max-width: 560px;
      margin: 32px auto 48px;
      padding: 32px 28px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .advertise-page h1 {
      margin: 0 0 12px;
      font-size: 1.75rem;
      color: var(--text);
    }

    .advertise-page p {
      margin: 0 0 24px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .advertise-email-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: var(--radius-pill);
      background: linear-gradient(135deg, #312e81, #4f46e5);
      color: #ffffff !important;
      font-size: 1.15rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(79, 70, 229, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      word-break: break-all;
    }

    .advertise-email-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(79, 70, 229, 0.34);
      color: #ffffff !important;
    }

    .advertise-hint {
      margin-top: 16px;
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .advertise-back {
      display: inline-block;
      margin-top: 28px;
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body class="app">
  <div id="site-header"></div>
  <script src="/common.js" defer></script>

  <main class="advertise-page legal-page">
    <h1>📣 פרסום ב-LottoGun</h1>
    <p>
      מעוניינים לפרסם אצלנו? שלחו לנו מייל עם פרטי העסק וההצעה —
      נחזור אליכם עם אפשרויות פרסום ותמחור.
    </p>
    <a
      class="advertise-email-link"
      href="mailto:lottogun.office@gmail.com?subject=%D7%A4%D7%A8%D7%A1%D7%95%D7%9D%20%D7%91-LottoGun"
    >
      ✉️ lottogun.office@gmail.com
    </a>
    <p class="advertise-hint">לחיצה תפתח את תיבת המייל שלכם</p>
    <a class="advertise-back" href="/">← חזרה לדף הבית</a>
  </main>

  <div id="footer"></div>
</body>
</html>

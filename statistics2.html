    <script src="/js/lottery-data.js"></script>
    <script>
        let allResults = [];
        let regularStats = {};
        let strongStats = {};

        // טעינת הנתונים וחישוב הסטטיסטיקות
        async function loadAndCalculateStats() {
            try {
                await LottoData.load();
                allResults = LottoData.getLegacyRows();
                calculateCombinations();
                displayStatistics();
                
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('statsContent').style.display = 'block';
                
            } catch (error) {
                console.error('שגיאה בטעינת הנתונים:', error);
                document.getElementById('loadingMessage').innerHTML = '❌ שגיאה בטעינת ארכיון התוצאות.';
            }
        }


        
        // חישוב צירופים נפוצים
        function calculateCombinations() {
            pairStats = {};
            tripleStats = {};
            quadStats = {};
            quintStats = {};

            allResults.forEach(result => {
                const numbers = [];
                
                // איסוף המספרים מההגרלה - נסה את כל האפשרויות
                for (let i = 1; i <= 6; i++) {
                    let num = result[i.toString()] || // '1', '2', '3', etc.
                             result[String.fromCharCode(65 + i)] || // 'B', 'C', 'D', etc.
                             result[`מספר ${i}`]; // 'מספר 1', 'מספר 2', etc.
                    
                    // בדיקה אם זה מחרוזת עם מספרים
                    if (typeof num === 'string') {
                        num = parseInt(num);
                    }
                    
                    if (num && !isNaN(num) && num >= 1 && num <= 37) {
                        numbers.push(num);
                    }
                }
                
                // רק אם יש לנו בדיוק 6 מספרים
                if (numbers.length === 6) {
                    numbers.sort((a, b) => a - b);
                    
                    // חישוב זוגות
                    for (let i = 0; i < numbers.length; i++) {
                        for (let j = i + 1; j < numbers.length; j++) {
                            const pair = `${numbers[i]}-${numbers[j]}`;
                            pairStats[pair] = (pairStats[pair] || 0) + 1;
                        }
                    }
                    
                    // חישוב שלשות
                    for (let i = 0; i < numbers.length; i++) {
                        for (let j = i + 1; j < numbers.length; j++) {
                            for (let k = j + 1; k < numbers.length; k++) {
                                const triple = `${numbers[i]}-${numbers[j]}-${numbers[k]}`;
                                tripleStats[triple] = (tripleStats[triple] || 0) + 1;
                            }
                        }
                    }
                    
                    // חישוב רביעיות
                    for (let i = 0; i < numbers.length; i++) {
                        for (let j = i + 1; j < numbers.length; j++) {
                            for (let k = j + 1; k < numbers.length; k++) {
                                for (let l = k + 1; l < numbers.length; l++) {
                                    const quad = `${numbers[i]}-${numbers[j]}-${numbers[k]}-${numbers[l]}`;
                                    quadStats[quad] = (quadStats[quad] || 0) + 1;
                                }
                            }
                        }
                    }

                    // חישוב חמישיות
for (let i = 0; i < numbers.length; i++) {
    for (let j = i + 1; j < numbers.length; j++) {
        for (let k = j + 1; k < numbers.length; k++) {
            for (let l = k + 1; l < numbers.length; l++) {
                for (let m = l + 1; m < numbers.length; m++) {
                    const quint = `${numbers[i]}-${numbers[j]}-${numbers[k]}-${numbers[l]}-${numbers[m]}`;
                    quintStats[quint] = (quintStats[quint] || 0) + 1;
                }
            }
        }
    }
}
                }
            });
            
            // הוספת debug info
            console.log('Total pairs found:', Object.keys(pairStats).length);
            console.log('Top 3 pairs:', Object.entries(pairStats).sort((a,b) => b[1] - a[1]).slice(0,3));
        }            


        // הצגת הסטטיסטיקות
        function displayStatistics() {
            displayInsights();
        }





                // הצגת תובנות וצירופים
        function displayInsights() {
    // הצגת זוגות נפוצים (שחוזרים לפחות 20 פעמים)
    const topPairs = Object.entries(pairStats)
        .filter(([pair, count]) => count >= 20)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 300); // מגביל ל-100 הראשונים
    
    console.log('Pairs found:', topPairs.length);
    
    const pairsContainer = document.getElementById('popularPairs');
    pairsContainer.innerHTML = topPairs.map(([pair, count]) => 
        `<div class="combination-item">
            <span class="combination-numbers">${pair.replace('-', ', ')}</span>
            <span class="combination-count">${count} פעמים</span>
        </div>`
    ).join('');

    // הצגת שלשות נפוצות (שחוזרות לפחות 5 פעמים)
    const topTriples = Object.entries(tripleStats)
        .filter(([triple, count]) => count >= 5)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 200);
    
    console.log('Triples found:', topTriples.length);
    
    const triplesContainer = document.getElementById('popularTriples');
    triplesContainer.innerHTML = topTriples.map(([triple, count]) => 
        `<div class="combination-item">
            <span class="combination-numbers">${triple.replace(/-/g, ', ')}</span>
            <span class="combination-count">${count} פעמים</span>
        </div>`
    ).join('');

    // הצגת רביעיות נפוצות (שחוזרות לפחות 2 פעמים)
    const topQuads = Object.entries(quadStats)
        .filter(([quad, count]) => count >= 2)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 200);
    
    console.log('Quads found:', topQuads.length);
    
    const quadsContainer = document.getElementById('popularQuads');
    quadsContainer.innerHTML = topQuads.map(([quad, count]) => 
        `<div class="combination-item">
            <span class="combination-numbers">${quad.replace(/-/g, ', ')}</span>
            <span class="combination-count">${count} פעמים</span>
        </div>`
    ).join('');

    // הצגת חמישיות שחוזרות לפחות 2 פעמים
    const topQuints = Object.entries(quintStats)
        .filter(([quint, count]) => count >= 2)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 200);
    
    console.log('Quints found:', topQuints.length);

    const quintsContainer = document.getElementById('popularQuints');
    quintsContainer.innerHTML = topQuints.map(([quint, count]) => 
        `<div class="combination-item">
            <span class="combination-numbers">${quint.replace(/-/g, ', ')}</span>
            <span class="combination-count">${count} פעמים</span>
        </div>`
    ).join('');
        }

        // פונקציה להצגת סוג צירוף מסוים
function showCombination(type) {
    // הסתרת כל הכרטיסים
    document.getElementById('pairsCard').style.display = 'none';
    document.getElementById('triplesCard').style.display = 'none';
    document.getElementById('quadsCard').style.display = 'none';
    document.getElementById('quintsCard').style.display = 'none';
    
    // הסרת המחלקה active מכל הכפתורים
    document.querySelectorAll('.combo-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    
    // הצגת הכרטיס המתאים והפעלת הכפתור
    switch(type) {
        case 'pairs':
            document.getElementById('pairsCard').style.display = 'block';
            document.getElementById('pairsBtn').classList.add('active');
            break;
        case 'triples':
            document.getElementById('triplesCard').style.display = 'block';
            document.getElementById('triplesBtn').classList.add('active');
            break;
        case 'quads':
            document.getElementById('quadsCard').style.display = 'block';
            document.getElementById('quadsBtn').classList.add('active');
            break;
        case 'quints':
            document.getElementById('quintsCard').style.display = 'block';
            document.getElementById('quintsBtn').classList.add('active');
            break;
    }
}

// הצגת זוגות כברירת מחדל כשהדף נטען
document.addEventListener('DOMContentLoaded', function() {
    // זה ירוץ רק אחרי שהנתונים ייטענו
    const checkStatsLoaded = setInterval(() => {
        if (document.getElementById('statsContent').style.display !== 'none') {
            showCombination('pairs');
            clearInterval(checkStatsLoaded);
        }
